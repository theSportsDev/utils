name: Publish to GitHub Packages

on:
  push:
    branches:
      - main
    paths-ignore:
      - src/**/*.spec.js
      - .github/**/*
      - .env

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@theSportsDev'

      - name: Install dependencies
        run: npm ci

      - name: Check if version already published
        id: version-check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          if npm view @theSportsDev/utils@$VERSION --registry https://npm.pkg.github.com > /dev/null 2>&1; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "⚠️ Version $VERSION is already published. Skipping publish."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "✅ Version $VERSION is new. Proceeding with publish."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: steps.version-check.outputs.skip == 'false'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
