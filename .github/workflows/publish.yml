name: Publish to GitHub Packages

# main 브랜치에 새 커밋이 생길 때마다 실행
on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    # 봇이 자동 bump 후 올린 커밋에서는 재실행하지 않음 (무한 루프 방지)
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    permissions:
      contents: write # version bump 커밋을 push 하기 위한 권한
      packages: write # GitHub Packages에 publish 하기 위한 권한

    steps:
      # push 범위 전체 diff 비교를 위해 충분한 히스토리 체크아웃
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 100
          token: ${{ secrets.GH_TOKEN }}

      # Node.js 설정 및 GitHub Packages 레지스트리(@theSportsDev scope) 등록
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@theSportsDev'

      # 이번 push에 포함된 커밋 전체에서 package.json version 필드 변경 여부 확인
      # HEAD~1 대신 push 이벤트의 before/after SHA로 정확한 범위 비교
      - name: Check version change
        id: check
        run: |
          CHANGED=$(git diff ${{ github.event.before }} ${{ github.event.after }} -- package.json | (grep -c -E '^\+\s+"version"' || true))
          echo "changed=$CHANGED" >> $GITHUB_OUTPUT

      # version이 그대로면 patch를 자동으로 올린 뒤 [skip ci] 태그와 함께 push
      # 다음 workflow 실행 시 위의 if 조건에 걸려 스킵됨
      - name: Auto bump patch version
        if: steps.check.outputs.changed == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          npm version patch --no-git-tag-version
          NEW_VERSION=$(jq -r .version package.json)
          git commit -am "[Bot]: bump patch version to $NEW_VERSION [skip ci]"
          git push

      # 의존성 설치 후 GitHub Packages에 publish
      - name: Install and publish
        run: |
          npm config set @theSportsDev:registry https://npm.pkg.github.com
          npm config set //npm.pkg.github.com/:_authToken=${{ secrets.GH_TOKEN }}

          npm ci
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_TOKEN }}

      # Slack Channel (#npm-publish-notify)에 버저닝 notify
      - name: Notify to Slack channel
        if: success()
        run: |
          VERSION=$(jq -r .version package.json)
          PACKAGE=$(jq -r .name package.json)

          # 이번 push에 포함된 커밋 목록 (merge commit 제외)
          COMMITS=$(git log ${{ github.event.before }}..${{ github.event.after }} --no-merges --pretty=format:"• %an: %s")

          SLACK_MSG="<https://github.com/theSportsDev/utils/pkgs/npm/${PACKAGE}|${PACKAGE}@${VERSION}> released! :rocket:"
          if [ -n "$COMMITS" ]; then
            SLACK_MSG="${SLACK_MSG}
${COMMITS}"
          fi

          # publish 성공 후 notify 실패로 job 전체가 failure로 표시되는 것을 방지
          curl -X POST \
            -H 'Content-type: application/json' \
            --data "$(jq -n --arg text "$SLACK_MSG" \
              '{"channel":"#dev_alarm","text":$text,"username":"배포 알림 봇","icon_emoji":":npm:"}')" \
            "${{ secrets.SLACK_WEBHOOK_URL }}" || true
